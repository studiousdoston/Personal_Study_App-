<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f8f6f1" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#111613" media="(prefers-color-scheme: dark)" />

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BrainMaxx" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BrainMaxx</title>

    <style>
      html,
      body {
        margin: 0;
        background: #f8f6f1;
      }
      .boot-splash {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Sans KR",
          sans-serif;
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .boot-splash-logo {
        display: block;
      }
      .boot-splash-name {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.5;
        color: #2f7d5b;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #111613;
        }
        .boot-splash-name {
          color: #6cc79a;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-content">
          <img src="/favicon.svg" alt="" width="80" height="80" class="boot-splash-logo" />
          <span class="boot-splash-name">BrainMaxx</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
