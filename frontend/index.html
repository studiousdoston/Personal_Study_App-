<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <meta name="theme-color" content="#f8f6f1" />
    <script>
      (function () {
        var pref = null;
        try {
          pref = localStorage.getItem("brainmaxx-theme");
        } catch (e) {}
        try {
          var dark = window.matchMedia("(prefers-color-scheme: dark)").matches;
          var theme = pref === "light" || pref === "dark" ? pref : dark ? "dark" : "light";
          var root = document.documentElement;
          root.setAttribute("data-theme", theme);
          root.style.colorScheme = theme;
          var meta = document.querySelector('meta[name="theme-color"]');
          if (meta) meta.setAttribute("content", theme === "dark" ? "#111613" : "#f8f6f1");
        } catch (e) {}
      })();
    </script>

    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="BrainMaxx" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <title>BrainMaxx</title>

    <style>
      html,
      body {
        margin: 0;
        background: #f8f6f1;
      }
      .boot-splash {
        min-height: 100dvh;
        display: flex;
        align-items: center;
        justify-content: center;
        font-family:
          system-ui,
          -apple-system,
          "Segoe UI",
          Roboto,
          "Noto Sans KR",
          sans-serif;
      }
      .boot-splash-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }
      .boot-splash-logo {
        display: block;
      }
      .boot-splash-name {
        font-size: 1.25rem;
        font-weight: 600;
        line-height: 1.5;
        color: #2f7d5b;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #111613;
      }
      html[data-theme="dark"] .boot-splash-name {
        color: #6cc79a;
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div class="boot-splash">
        <div class="boot-splash-content">
          <img src="/favicon.svg" alt="" width="80" height="80" class="boot-splash-logo" />
          <span class="boot-splash-name">BrainMaxx</span>
        </div>
      </div>
    </div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
